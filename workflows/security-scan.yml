# Reusable workflow for security scanning
name: Security Scan

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for the workflow'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working-directory }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Check for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json --only-verified
        continue-on-error: true

      - name: Dependency check
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f "package.json" ]; then
            npm audit --production || echo "npm audit warnings found"
          fi
          if [ -f "requirements.txt" ]; then
            pip install safety
            safety check -r requirements.txt || echo "Safety warnings found"
          fi
        continue-on-error: true
